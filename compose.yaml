name: github-issue-mcp-agent
services:
  mcp:
    build: .
    image: github-issue-mcp-agent:local
    command: ["python", "-m", "issue_agent.server", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8022"]
    environment:
      GITHUB_MODE: mock
      DATA_DIR: /data
      REPO_ALLOWLIST: student-lab/course-project
    volumes: ["agent-data:/data"]
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8022/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 15s
  web:
    image: github-issue-mcp-agent:local
    build: .
    environment:
      GITHUB_MODE: mock
      DATA_DIR: /data
      REPO_ALLOWLIST: student-lab/course-project
      MCP_URL: http://mcp:8022/mcp
    ports: ["127.0.0.1:${DEMO_PORT:-8021}:8021"]
    volumes: ["agent-data:/data"]
    networks: [frontend, backend]
    depends_on:
      mcp:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8021/ready', timeout=6)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s
volumes:
  agent-data:
networks:
  frontend:
  backend:
    internal: true
